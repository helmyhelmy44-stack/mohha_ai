<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="MOHHA — عين ترى أكثر"
  >

  <title>MOHHA — عين ترى أكثر</title>

  <link rel="stylesheet" href="/css/style.css">
</head>

<body>

  <main class="app">

    <header class="header">

      <div class="brand">

        <div class="logo">
          MOHHA
        </div>

        <div class="slogan">
          عين ترى أكثر
        </div>

      </div>

      <div class="status">
        <span class="status-dot"></span>
        <span>متصل</span>
      </div>

    </header>


    <section class="welcome">

      <div class="logo-box">
        M
      </div>

      <h1>
        مرحبًا بك في MOHHA
      </h1>

      <p>
        مساعدك الذكي — نبني التجربة من الصفر، خطوة بخطوة.
      </p>

    </section>


    <section class="chat">

      <div
        id="messages"
        class="messages"
      >

        <div class="message mohha-message">

          <strong>
            MOHHA
          </strong>

          <p>
            أنا جاهز. اكتب رسالتك لنبدأ.
          </p>

        </div>

      </div>


      <form
        id="chat-form"
        autocomplete="off"
      >

        <input
          id="message-input"
          type="text"
          placeholder="اكتب رسالتك..."
          autocomplete="off"
          maxlength="2000"
        >

        <button
          id="send-button"
          type="submit"
        >
          إرسال
        </button>

      </form>

    </section>


    <footer class="footer">
      MOHHA © 2026
    </footer>

  </main>


  <script src="/js/app.js"></script>

</body>

</html>
