<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>MOHHA — عين ترى أكثر</title>

  <link rel="stylesheet" href="/css/style.css">
</head>

<body>

  <main class="app">

    <header class="header">
      <div>
        <div class="logo">MOHHA</div>
        <div class="slogan">عين ترى أكثر</div>
      </div>

      <div class="status">
        <span></span>
        متصل
      </div>
    </header>

    <section class="welcome">

      <div class="logo-box">M</div>

      <h1>مرحبًا بك في MOHHA</h1>

      <p>
        مساعدك الذكي — نبني التجربة من الصفر،
        خطوة بخطوة.
      </p>

    </section>

    <section class="chat">

      <div id="messages" class="messages">

        <div class="message">
          <strong>MOHHA</strong>

          <p>
            أنا جاهز. اكتب رسالتك لنبدأ.
          </p>
        </div>

      </div>

      <form id="chat-form">

        <input
          id="message-input"
          type="text"
          placeholder="اكتب رسالتك..."
          autocomplete="off"
        >

        <button type="submit">
          إرسال
        </button>

      </form>

    </section>

  </main>

  <script src="/js/app.js"></script>

</body>
</html>
